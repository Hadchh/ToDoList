<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-do list</h1>
      <p id="counter" class="counter"></p>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="120">
      <button type="submit" class="add-btn">Add task</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add one above to get started.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
